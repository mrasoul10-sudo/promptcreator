# Cloudflare Worker for Prompt Creator's free prompt service. Deployed by .github/workflows/deploy-worker.yml.
name = "promptcreator-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Comma-separated origins allowed to call the API (the GitHub Pages site and local development).
ALLOWED_ORIGINS = "https://mrasoul10-sudo.github.io,http://localhost:8765"
# Gemini models: the alias always points at the current free Flash model; the fallback is used when it is busy.
GEMINI_MODEL = "gemini-flash-latest"
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
DAILY_LIMIT_PER_VISITOR = "20"
DAILY_LIMIT_GLOBAL = "900"
PER_MINUTE_LIMIT_GLOBAL = "8"
# Secret (never in this file): GEMINI_API_KEY. Set as a GitHub Actions secret; the workflow uploads it.

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Builds the Android app (Capacitor shell in app-android/ that loads the live site) and publishes the APK
# as the "android-latest" GitHub release: https://github.com/mrasoul10-sudo/promptcreator/releases/latest
# Runs on changes to app-android/ or this file, or manually from the Actions tab.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/free-credit-usage-2bg9tp, main]
    paths:
      - 'app-android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Declare the website and the microphone permission
        # asset_statements names the sites this app belongs to, so Chrome's getInstalledRelatedApps() on those
        # sites can tell the app is installed and stop offering it (manifest.webmanifest lists the app).
        run: |
          node -e '
            const fs = require("fs");
            const sites = ["https://mrasoul10-sudo.github.io", "https://promptsaz.pages.dev"];
            const json = JSON.stringify(sites.map((site) => ({ relation: ["delegate_permission/common.handle_all_urls"], target: { namespace: "web", site } })));
            const strings = "android/app/src/main/res/values/strings.xml";
            fs.writeFileSync(strings, fs.readFileSync(strings, "utf8").replace("</resources>",
              `    <string name="asset_statements" translatable="false">${json.replace(/"/g, "\\\"")}</string>\n</resources>`));
            const manifest = "android/app/src/main/AndroidManifest.xml";
            // Microphone for voice input: the page records with getUserMedia, which the WebView grants
            // through Capacitor once the app holds these permissions.
            fs.writeFileSync(manifest, fs.readFileSync(manifest, "utf8")
              .replace(/(<application[^>]*>)/, `$1\n        <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />`)
              .replace("</manifest>", `    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>`));
          '
          grep asset_statements android/app/src/main/res/values/strings.xml android/app/src/main/AndroidManifest.xml

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#6C4CF5' --iconBackgroundColorDark '#6C4CF5' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#212121'

      - name: Stamp the version into the user agent
        # The site reads "PromptSazApp/<versionCode>" to tell the installed version and offer updates.
        run: |
          node -e 'const f="capacitor.config.json",c=JSON.parse(require("fs").readFileSync(f));c.android.appendUserAgent="PromptSazApp/"+process.env.RUN;require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
          grep appendUserAgent capacitor.config.json
        env:
          RUN: ${{ github.run_number }}

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build APK
        run: |
          # A fixed signing key (app-android/debug.keystore) so each new APK installs over the previous one.
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../promptsaz.apk
          ls -la ../promptsaz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: promptsaz-apk
          path: app-android/promptsaz.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: پرامپت‌ساز برای اندروید (نسخه ${{ github.run_number }})
          body: |
            فایل **promptsaz.apk** را روی گوشی اندروید دانلود و نصب کنید (اجازه «نصب از منابع ناشناس» را بدهید).
            نسخه‌های بعدی روی همین نسخه نصب می‌شوند و اطلاعات شما در برنامه حفظ می‌شود.
          files: app-android/promptsaz.apk
          make_latest: true

      - name: Tell the site about the new version
        # assets/android-version.json is read by the app (assets/js/updates.js) to offer the update.
        working-directory: .
        run: |
          cat > assets/android-version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "apkUrl": "https://github.com/${{ github.repository }}/releases/download/android-latest/promptsaz.apk", "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cat assets/android-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/android-version.json
          git commit -m "Android app version ${{ github.run_number }}"
          # The build leaves generated changes in app-android/; set them aside so the rebase can run.
          git stash --include-untracked --quiet || true
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          echo "::error::Could not push assets/android-version.json"; exit 1

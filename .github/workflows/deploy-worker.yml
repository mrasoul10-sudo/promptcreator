# Deploys the free prompt service (worker/) to Cloudflare Workers and points the site at it.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (Workers & Pages overview page)
#   GEMINI_API_KEY         Gemini API key from https://aistudio.google.com/apikey
# Then run this workflow once from the Actions tab (or push a change under worker/).

name: Deploy free API (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    branches: [claude/free-credit-usage-2bg9tp, main]
    paths:
      - 'worker/**'
      - 'assets/js/prompt-spec.js'
      - 'assets/js/moderation.js'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$GEMINI" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY are required. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Test worker
        if: steps.secrets.outputs.ready == 'true'
        run: node tests/worker.test.mjs

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Point the site at the deployed worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          URL="${DEPLOY_URL%/}"
          if [ -z "$URL" ]; then echo "::warning::Could not read the worker URL"; exit 0; fi
          echo "Worker URL: $URL"
          if grep -q "FREE_API_URL = '$URL'" assets/js/config.js; then echo "config.js already up to date"; exit 0; fi
          sed -i "s|^export const FREE_API_URL = .*|export const FREE_API_URL = '$URL';|" assets/js/config.js
          node tools/bump-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js index.html
          git commit -m "Point the site at the free API: $URL"
          git push

      - name: Diagnose Gemini models
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Prints each configured model's status and error text (never the key) to spot free-tier or naming issues.
          for m in $(grep -E '^GEMINI_(FALLBACK_)?MODEL' worker/wrangler.toml | cut -d'"' -f2); do
            code=$(curl -sS -o /tmp/g.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -H 'content-type: application/json' -H "x-goog-api-key: $GEMINI_API_KEY" \
              -d '{"contents":[{"parts":[{"text":"Say OK"}]}],"generationConfig":{"maxOutputTokens":20}}')
            echo "$m -> HTTP $code: $(node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/g.json","utf8"));console.log(b.error?b.error.status+" "+b.error.message:"ok, modelVersion="+b.modelVersion)' 2>/dev/null | head -c 400)"
          done

      - name: Smoke test (live worker + Gemini)
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          URL="${DEPLOY_URL%/}"
          [ -z "$URL" ] && { echo "::warning::No worker URL"; exit 0; }
          # A new workers.dev subdomain can take a minute or two to start answering.
          for i in $(seq 1 18); do
            if curl -fsS "$URL/health"; then echo; break; fi
            echo "waiting for $URL ($i)"; sleep 10
          done
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$URL/generate" \
            -H 'content-type: application/json' -H 'origin: https://promptsaz.pages.dev' \
            -d '{"source":"یک لوگوی مینیمال برای کافه با رنگ‌های گرم","type":"image","lang":"both","detail":"concise"}')
          echo "HTTP $code"
          head -c 3000 /tmp/out.json; echo
          if [ "$code" != "200" ]; then echo "::error::Live /generate returned HTTP $code"; exit 1; fi
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/out.json","utf8")).result; if(!r.promptEn||!r.promptFa){console.error("empty prompt");process.exit(1)}'
          # Voice input: one second of silence as 16 kHz WAV must be accepted (empty text is fine).
          node -e 'const n=16000,b=Buffer.alloc(44+n*2);b.write("RIFF",0);b.writeUInt32LE(36+n*2,4);b.write("WAVE",8);b.write("fmt ",12);b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);b.writeUInt16LE(1,22);b.writeUInt32LE(n,24);b.writeUInt32LE(n*2,28);b.writeUInt16LE(2,32);b.writeUInt16LE(16,34);b.write("data",36);b.writeUInt32LE(n*2,40);require("fs").writeFileSync("/tmp/silence.wav",b)'
          vcode=$(curl -sS -o /tmp/voice.json -w '%{http_code}' -X POST "$URL/transcribe" \
            -H 'content-type: audio/wav' -H 'origin: https://promptsaz.pages.dev' --data-binary @/tmp/silence.wav)
          echo "transcribe HTTP $vcode: $(head -c 400 /tmp/voice.json)"
          if [ "$vcode" != "200" ]; then echo "::error::Live /transcribe returned HTTP $vcode"; exit 1; fi
          # Accounts server (Store Durable Object) answers
          acode=$(curl -sS -o /tmp/acc.json -w '%{http_code}' -X POST "$URL/auth/lookup" \
            -H 'content-type: application/json' -H 'origin: https://promptsaz.pages.dev' -d '{"email":"smoke-test@example.com"}')
          echo "auth/lookup HTTP $acode: $(cat /tmp/acc.json)"
          if [ "$acode" != "200" ]; then echo "::error::Live /auth/lookup returned HTTP $acode"; exit 1; fi
          # Quality sample: an informal Persian change request must come back restructured, not echoed.
          curl -sS -o /tmp/q.json -X POST "$URL/generate" \
            -H 'content-type: application/json' -H 'origin: https://promptsaz.pages.dev' \
            --data-binary @- <<'JSON'
          {"source":"مانده برنامه کل برنامه اینها به عدد نوشتن کار خوبی نیست چرا ؟ نباید مثلا تعداد باربیکیو اروپایی را با نظم دهنده جمع بست . هرکدام 2 محصول مجزا هستند و هیچ ارتباطی به یکدیگر ندارند . بخش فیلترها و تایتل بلوک دو خطی شده . فیلترها در یک خط سمت راست و دکمه های پرینت سمت چپ باشند","type":"auto","lang":"both","detail":"balanced"}
          JSON
          node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/q.json","utf8")); console.log("model:", b.model); console.log(b.result ? "--- FA ---\n"+b.result.promptFa+"\n--- EN ---\n"+b.result.promptEn : JSON.stringify(b))'
